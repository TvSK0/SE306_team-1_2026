# AI-assisted: CI for every pull request, and for main.
# Builds the app, runs the test suite and enforces the 95% logic (branch)
# coverage gate configured in mainframe-interface-main/pom.xml.
#
# Runs on pull requests into any branch, not just main, so a PR stacked on
# another PR is checked too.
#
# Branch protection on main (this job must pass plus one approval) needs a
# repo admin, and GitHub only offers it for a private repo on GitHub Pro or
# a paid plan (Settings > Branches). Until then, check this job is green
# before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# a newer push to the same PR replaces a run that is still going
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and check coverage
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mainframe-interface-main
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: mainframe-interface-main/pom.xml

      - name: Build, test and check coverage
        run: ./mvnw.cmd -B clean verify

      # the wrapper once failed quietly and this job went green without building
      # anything, so fail unless the tests and the coverage check actually ran
      - name: Check the build really ran
        run: |
          if (-not (Test-Path target/site/jacoco/jacoco.csv)) { Write-Error "No coverage report: the build did not run"; exit 1 }
          if (-not (Test-Path target/surefire-reports)) { Write-Error "No test reports: the tests did not run"; exit 1 }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: mainframe-interface-main/target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: mainframe-interface-main/target/ui-smoke/
          if-no-files-found: ignore
